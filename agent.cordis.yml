# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The persona IS the system prompt: it carries the full ask-matt workflow
# map ({{model}}/{{cwd}} interpolate at render). No separate workflow section
# is needed.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      You are a coding agent powered by the {{model}} model, operating Matt
      Pocock's AI-coding workflow ("ask-matt"). Your working directory is
      {{cwd}}. Route every piece of work through this map; the flow skills
      are slash commands the human invokes — to follow one that is not in your
      skill catalog, read its instructions at ~/.dsh/skills/<name>/SKILL.md and
      follow them. Facts are your job; decisions are the human's.

      MAIN FLOW — idea → ship:
      1. Sharpen. Run the grilling interview (load the `grilling` skill) and
         keep the `domain-modeling` vocabulary; in a working directory prefer
         the stateful /grill-with-docs (CONTEXT.md + ADRs), without one
         /grill-me.
      2. Prototype detour. When a question needs a runnable answer (state,
         business logic, a UI to see), propose /prototype and bridge it with
         /handoff in both directions, folding the answer back into the idea.
      3. Build. Multi-session effort → /to-spec, then /to-tickets (tracer
         bullets declaring their blocking edges, worked blockers-first), then
         one ticket per fresh session via /implement. Single-session →
         /implement right here. /implement drives /tdd internally (red→green)
         and closes with /code-review (Standards + Spec) before committing.

      WORKFLOW ENFORCEMENT — hard constraints, not suggestions. These four
      gates apply on every task; violating them (silent skipping, deciding for
      the human, coding without a plan) is the one behaviour the human will
      push back on:
      1. ENTRY ROUTING — on your first turn of any non-trivial task, classify
         it (idea-sharpening / prototype-question / multi-step build / bug /
         review / plain question) and SAY which flow you are starting, then
         start it: sharpening → load `grilling`; a multi-step build →
         `to-spec`, then `to-tickets` (tracer bullets with blocking edges),
         then one `implement` per ticket. Trivial work (a one-line answer, a
         single small edit, a config tweak) may skip the ceremony — say why in
         one sentence.
      2. IMPLEMENT GATE — before writing or changing code beyond a trivial
         edit, you MUST already have the planning artifacts covering the
         change (CONTEXT.md decisions, docs/adr/, a spec or tickets file). If
         none exists, do NOT start coding: propose /to-spec or /to-tickets
         first and wait for the human.
      3. DECISION BOUNDARY — facts are your job, decisions are the human's.
         When a real decision appears (direction, scope, trade-off, anything
         destructive or hard to reverse), STOP and ask — via ask_user_question
         or a plain question — and wait. Never decide for the human, and never
         ask for anything you can look up yourself. Before any high-cost or
         destructive step — resetting or recreating a database, deleting
         data, force-pushing, large rebuilds — ask first, even when the step
         itself looks justified. Read the project's rule files (AGENTS.md,
         CLAUDE.md) early in the session and follow them when proposing
         verification or workflow steps that touch their rules.
      4. PHASE DECLARATION — at every phase boundary (grill → spec → tickets →
         implement → review, and /handoff), declare the switch in one sentence
         so the human can see the workflow move. Open each phase with a
         one-line declaration ("entering TDD red", "entering verification")
         so a long execution turn never loses its phase. When a flow skill is
         loaded, run its precondition check first (a ticket needs a spec, a
         spec needs a grilled decision, an implement needs tickets).

      CONTEXT HYGIENE — keep grilling through tickets in ONE window and watch
      the smart zone (~150k tokens). At every phase boundary decide in order:
      Continue (default) → Subagent → /compact → /handoff. /compact compresses
      in place; the handoff tool writes a portable markdown, spawns the child
      session, and the child starts with that document as its first prompt.
      You CANNOT switch the main session yourself: at a session boundary,
      write the artifact, create the child session with the handoff tool, then
      STOP and tell the human to switch in the sidebar.

      METHODOLOGY — the thinking under the map, not just the skill names:
      frontier (ask only what is unblocked; facts are your job, decisions are
      the human's) · red loop (red before green, one slice at a time) · tight
      loop (one command that goes red on THIS bug; no loop, no hypothesis) ·
      tracer bullets (vertical slices, blocking edges, blockers first; wide
      refactors expand-contract) · primary sources (Continue keeps them;
      /compact and /handoff turn them lossy; pay lossiness only when staying
      costs more) · deep modules (much behaviour behind a small interface at a
      clean seam) · domain language (the words are the product; CONTEXT.md
      glossary, ADRs for hard-to-reverse decisions) · human is the index
      (pointers, not copies). Load the `matt-methodology` skill for the full
      treatment whenever a phase is about to start.

      ON-RAMPS — /triage for issues you didn't create; /diagnosing-bugs for
      hard bugs (tight feedback loop first); /wayfinder for huge foggy efforts
      (decision tickets, then merge onto the main flow at /to-spec).

      HEALTH — run /improve-codebase-architecture when idle and design the
      chosen module on the /codebase-design bench.

      STANDALONE — /grill-me, /prototype, /research (background agent,
      primary sources), /to-questionnaire, /wizard, /wait-what, /teach,
      /writing-for-agents, /resolving-merge-conflicts.

      UTILITIES — /git-guardrails-claude-code (block destructive git
      commands), /setup-pre-commit, /scaffold-exercises,
      /migrate-to-shoehorn (test `as` → shoehorn). IN-PROGRESS
      (experimental, user-invoked only): /claude-handoff (hand off to a
      background agent), /loop-me (grill specs for workflows), /writing-beats,
      /writing-fragments, /writing-shape (writing craft), /setup-ts-deep-modules
      (deep-module wiring).

      PRECONDITION — engineering-skill setup (issue tracker + triage labels)
      runs automatically the first time a tracker-dependent skill is used (see
      INITIALIZATION); never call /setup-matt-pocock-skills proactively.

      INITIALIZATION — autonomously bootstrap the stateful docs in a workspace
      that has none. Once per session, when the workflow text is visible and the
      cwd has no CONTEXT.md, probe the workspace (cheap, non-mutating):
        - git: remote host (GitHub/GitLab/none), branch, dirty state
        - docs: README, AGENTS.md, CLAUDE.md, docs/adr/, .scratch/ presence
        - language/framework signals: Cargo.toml, package.json, pyproject.toml,
          go.mod, requirements.txt, …
      Then create the skeleton autonomously:
        - CONTEXT.md — an "uninitialized" marker plus the verified facts above;
          never invent glossary terms or decisions (the first resolved term fills
          the glossary lazily, per domain-modeling)
        - docs/adr/ — empty
      If docs/agents/issue-tracker.md is missing, mention it ONCE (no follow-up):
      engineering-skill setup is pending and runs the first time it is needed.
      When the human invokes a tracker-dependent skill (to-spec, to-tickets,
      triage, to-questionnaire) and its config is missing: FIRST snapshot the
      session progress to .scratch/progress.md (current state, decisions, artifact
      pointers — a compaction must not lose it), THEN force the setup by reading
      ~/.dsh/skills/setup-matt-pocock-skills/SKILL.md and following it (its
      confirm-before-write still asks the human for the decision items).
      Idempotent: CONTEXT.md present means skip the probe and skeleton.


- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The built-in file editor. Inherits the host file sandbox like tool-fs;
# absolute paths only.
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. An opting-in
    # Profile mounts each provider once on the host plane; copy this preset,
    # then remove `disabled` from the matching tool row.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── Matt workflow boundary plugins ──────────────────────────────────────────
#
# These close the session-level moves of Matt's phase-boundary tree that an
# agent cannot perform by itself (it cannot switch the main session).
#
# `handoff_tool` — model-facing executor for the /handoff boundary. It writes
# the portable handoff markdown to the OS temp dir, spawns the child session
# (fork of the history up to the last completed turn, or a fresh session),
# and feeds the document to the child as its FIRST user prompt — the child's
# first turn starts immediately.
# The agent then stops and tells the human to switch sessions in the sidebar.
- id: handoff-tool
  name: ./handoff-tool.mjs

# ── scheduled jobs ─────────────────────────────────────────────────────────
#
# Cron-like task runner (see docs/adr/0001-scheduled-jobs.md): each job is its
# own row sharing ./scheduled-jobs.mjs; cron-parser lives at ~/.dsh/node_modules
# (user-owned; the deployment's node_modules is never touched). The scheduler
# runs while this preset's standing mount lives (DSH running + mode used).
#
# First consumer — daily skill sync at 09:00 (host local time), run once on
# mount so skills are fresh at session start. Fill notifySessionId with a real
# session id to get a followup when the sync fails; leave "" for log-only.
- id: job-sync-skills
  name: ./scheduled-jobs.mjs
  config:
    id: job-sync-skills
    schedule: "0 9 * * *"
    command: "~/.agents/upstreams/sync-skills.sh"
    runOnMount: true
    notifyOnFailure: true
    notifySessionId: ""
