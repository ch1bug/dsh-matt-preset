name: Matt 工作流模式
description: 完全按照 Matt Pocock 的 AI 编码工作流运转：grill 打磨想法 → 原型判定 → to-spec / to-tickets 拆票 → implement（内嵌 tdd）→ code-review；on-ramp（triage / diagnosing-bugs / wayfinder）、代码健康、词汇层与阶段边界（continue → subagent → /compact → /handoff）全覆盖。会话边界由 handoff 工具补齐：handoff 写可移植文档并创建子会话（fork 带历史 / fresh 全新），全新会话走 GUI New Session。
order: 5
